name: V5 numerical, storage and publication tests
on: [push, pull_request]
jobs:
  v5-cpu-tests:
    if: startsWith(github.ref, 'refs/heads/v5') || startsWith(github.head_ref, 'v5')
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements_v5.txt
      - run: python verify_v5.py
      - run: python -m pytest tests -q -ra -p no:cacheprovider
