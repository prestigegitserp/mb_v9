name: V2 research unit and synthetic integration
on:
  push:
    branches: [v2-development, v2]
  pull_request:
    branches: [v2]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_v2_research.py tests/test_v9_validation.py
      - name: Real V7/V8 synthetic model integration
        run: python -m pytest -q tests/test_v2_vendor_integration.py
      - name: CLI smoke, all seven REPLACEMENT V2 models (not publication)
        run: |
          python run_v9.py main --datasets synthetic --quick --split-seeds 2026 --model-seeds 11 --k 4 --methods Method1,Method2,Method3,Method4,Method5,Method6,Method7 --output ./results_v2_ci
