name: V2 research unit tests
on:
  push:
    branches: [v2-development, v2]
  pull_request:
    branches: [v2]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Unit tests (not an end-to-end ML-100K benchmark)
        run: python -m pytest -q tests/test_v2_research.py tests/test_v9_validation.py
