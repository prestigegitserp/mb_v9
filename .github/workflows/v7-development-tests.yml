name: V7 restart, frozen versions, recovery and scientific contracts
on:
  push:
    branches: [v7-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v7-cpu-tests:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements_v7.txt
      - run: python verify_v5_2.py
      - run: python verify_v6.py
      - run: python verify_v7.py
      - run: python -m pytest tests -q -ra -p no:cacheprovider
