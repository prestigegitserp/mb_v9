name: V8 frozen parents, scientific contracts and locked TEST
on:
  push:
    branches: [v8_development, v8]
  pull_request:
    branches: [v8_development, v8]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v8-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements_v8.txt
      - run: python verify_v7.py
      - run: python verify_v8.py
      - run: python -m pytest tests/test_v8_scientific_contracts.py tests/test_v8_workflow.py tests/test_v8_recipes.py tests/test_v8_resume.py tests/test_v8_reporting.py tests/test_v8_estimate.py -q -ra -p no:cacheprovider
      - if: runner.os == 'Linux'
        run: python -m pytest tests -q -ra -p no:cacheprovider
